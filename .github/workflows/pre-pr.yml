name: pre-pr code style check

on:
  pull_request:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: copy the repo
        uses: actions/checkout@v3
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run lint
